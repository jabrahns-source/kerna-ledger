name: GridPulse Narrative Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install huggingface_hub
      - name: Run Master Script
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python api/gridpulse_hf_master.py --input '{"pmu_id": "TEST", "anomaly": "test"}'